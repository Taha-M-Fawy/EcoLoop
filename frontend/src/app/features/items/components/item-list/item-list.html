<div class="min-h-screen bg-slate-50 text-slate-800" dir="rtl">

  <!-- شريط الفلاتر مثبت تحت الناف بار مباشرة وبعرض الشاشة وبدون حقل البحث -->
  <div class="sticky top-16 z-40 w-full border-b border-slate-200 bg-white/95 backdrop-blur shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">

        <!-- التصنيفات -->
        <div>
          <select
            id="categoryFilter"
            name="categoryFilter"
            aria-label="تصفية حسب التصنيف"
            [(ngModel)]="filters.categoryId"
            (change)="applyFilters()"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs sm:text-sm outline-none transition focus:border-emerald-500 focus:bg-white cursor-pointer font-medium"
          >
            <option value="">كل التصنيفات</option>
            <option *ngFor="let cat of categories" [value]="cat._id">{{ cat.name }}</option>
          </select>
        </div>

        <!-- نوع المعاملة -->
        <div>
          <select
            id="typeFilter"
            name="typeFilter"
            aria-label="تصفية حسب نوع المعاملة"
            [(ngModel)]="filters.type"
            (change)="applyFilters()"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs sm:text-sm outline-none transition focus:border-emerald-500 focus:bg-white cursor-pointer font-medium"
          >
            <option value="all">جميع المعاملات</option>
            <option value="donation">تبرع مجاني</option>
            <option value="exchange">تبادل</option>
            <option value="sell">بيع رمزي</option>
          </select>
        </div>

        <!-- المحافظة -->
        <div>
          <select
            id="governorateFilter"
            name="governorateFilter"
            aria-label="تصفية حسب المحافظة"
            [(ngModel)]="filters.governorate"
            (change)="onGovChange()"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs sm:text-sm outline-none transition focus:border-emerald-500 focus:bg-white cursor-pointer font-medium"
          >
            <option value="">كل المحافظات</option>
            <option *ngFor="let gov of governorates" [value]="gov">{{ gov }}</option>
          </select>
        </div>

        <!-- المدينة / المركز -->
        <div>
          <select
            id="cityFilter"
            name="cityFilter"
            aria-label="تصفية حسب المدينة أو المركز"
            [(ngModel)]="filters.city"
            (change)="applyFilters()"
            [disabled]="!filters.governorate"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs sm:text-sm outline-none transition focus:border-emerald-500 focus:bg-white disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer font-medium"
          >
            <option value="">
              {{ filters.governorate ? 'كل المراكز / المدن' : 'اختر المحافظة أولاً' }}
            </option>
            <option *ngFor="let c of availableCities" [value]="c">{{ c }}</option>
          </select>
        </div>

      </div>
    </div>
  </div>

  <!-- شبكة المعروضات -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- مؤشر التحميل (Skeletons) -->
    <div
      *ngIf="loading"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
    >
      <div
        *ngFor="let n of [1, 2, 3, 4, 5, 6, 7, 8]"
        class="h-80 animate-pulse rounded-2xl bg-slate-200/80"
      ></div>
    </div>

    <!-- شبكة السلع -->
    <div
      *ngIf="!loading && items.length > 0"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 items-stretch"
    >
      <app-item-card *ngFor="let item of items" [item]="item" class="h-full" />
    </div>

    <!-- في حال عدم وجود نتائج -->
    <div
      *ngIf="!loading && items.length === 0"
      class="rounded-2xl border border-slate-200 bg-white py-16 text-center shadow-xs"
    >
      <div class="text-4xl mb-3">🔍</div>
      <h3 class="text-base font-bold text-slate-800">لا توجد معروضات مطابقة</h3>
      <p class="text-sm text-slate-500 mt-1">جرّب تغيير التصنيف أو المحافظة لإظهار نتائج أخرى.</p>
    </div>

    <!-- الترقيم (Pagination) -->
    <div
      *ngIf="!loading && totalItems > 0"
      class="mt-12 flex flex-col items-center justify-between gap-4 sm:flex-row border-t border-slate-200 pt-6"
    >
      <p class="text-xs text-slate-500">
        الصفحة <span class="font-bold text-slate-800">{{ currentPage }}</span> من إجمالي
        <span class="font-bold text-slate-800">{{ totalPages }}</span> صفحات ({{ totalItems }} سلعة)
      </p>

      <div class="flex items-center gap-1.5">
        <button
          type="button"
          (click)="goToPage(currentPage - 1)"
          [disabled]="currentPage === 1"
          class="rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-bold text-slate-600 shadow-xs transition hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer"
        >
          السابق
        </button>

        <button
          *ngFor="let page of pagesArray"
          type="button"
          (click)="goToPage(page)"
          [class.bg-emerald-600]="currentPage === page"
          [class.text-white]="currentPage === page"
          [class.border-emerald-600]="currentPage === page"
          [class.bg-white]="currentPage !== page"
          [class.text-slate-700]="currentPage !== page"
          class="h-9 w-9 rounded-xl border border-slate-200 text-xs font-bold transition flex items-center justify-center shadow-xs hover:border-emerald-500 cursor-pointer"
        >
          {{ page }}
        </button>

        <button
          type="button"
          (click)="goToPage(currentPage + 1)"
          [disabled]="currentPage === totalPages || totalPages === 0"
          class="rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-bold text-slate-600 shadow-xs transition hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer"
        >
          التالي
        </button>
      </div>
    </div>

  </main>
</div>

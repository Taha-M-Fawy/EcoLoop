<div class="profile-page">

  <div class="account-summary">

<div class="summary-avatar">
  👤
</div>

<h2>{{ user.username }}</h2>
<p>{{ user.email }}</p>

<div class="summary-line"></div>

<div class="summary-info">
  <span>نوع الحساب</span>
  <strong>{{ user.role === 'admin' ? 'مسؤول النظام' : 'مستخدم' }}</strong>
</div>

<div class="summary-info">
  <span>حالة الحساب</span>
  <strong class="active-status">● نشط</strong>
</div>

<div class="summary-brand">
  <span>ECLOOP</span>
  <small>حسابك في منصة التبادل</small>
</div>

  </div>

  <div class="profile-card">

<div class="profile-header">

  <div class="profile-icon">
    👤
  </div>

  <div>
    <span>ECLOOP</span>
    <h1>الملف الشخصي</h1>
    <p>إدارة بيانات حسابك الشخصي</p>
  </div>

</div>

<form (ngSubmit)="updateProfile()">

  <div class="input-group">
    <label>اسم المستخدم</label>

    <input
      type="text"
      name="username"
      [(ngModel)]="user.username"
      placeholder="اسم المستخدم"
    >
  </div>

  <div class="input-group">
    <label>البريد الإلكتروني</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="user.email"
      placeholder="البريد الإلكتروني"
    >
  </div>

  <div class="input-group">
    <label>كلمة المرور الجديدة</label>

    <div class="password-wrapper">

      <input
        [type]="showPassword ? 'text' : 'password'"
        name="password"
        [(ngModel)]="user.password"
        placeholder="اتركيها فارغة إذا لا تريدين تغييرها"
      >

      <button
        type="button"
        class="eye-btn"
        (click)="showPassword = !showPassword"
        aria-label="إظهار أو إخفاء كلمة المرور"
      >

        <svg
          [style.display]="showPassword ? 'none' : 'block'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="2.5"/>
        </svg>

        <svg
          [style.display]="showPassword ? 'block' : 'none'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3l18 18"/>
          <path d="M10.6 10.6a2.5 2.5 0 0 0 3.5 3.5"/>
          <path d="M9.9 4.3A10.8 10.8 0 0 1 12 4c6.5 0 10 6 10 6a18.5 18.5 0 0 1-3.1 3.8"/>
          <path d="M6.6 6.6C3.5 8.6 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"/>
        </svg>

      </button>

    </div>
  </div>

  <div class="input-group">
    <label>تأكيد كلمة المرور</label>

    <div class="password-wrapper">

      <input
        [type]="showConfirmPassword ? 'text' : 'password'"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="أعيدي كتابة كلمة المرور الجديدة"
      >

      <button
        type="button"
        class="eye-btn"
        (click)="showConfirmPassword = !showConfirmPassword"
        aria-label="إظهار أو إخفاء تأكيد كلمة المرور"
      >

        <svg
          [style.display]="showConfirmPassword ? 'none' : 'block'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="2.5"/>
        </svg>

        <svg
          [style.display]="showConfirmPassword ? 'block' : 'none'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3l18 18"/>
          <path d="M10.6 10.6a2.5 2.5 0 0 0 3.5 3.5"/>
          <path d="M9.9 4.3A10.8 10.8 0 0 1 12 4c6.5 0 10 6 10 6a18.5 18.5 0 0 1 3.1 3.8"/>
          <path d="M6.6 6.6C3.5 8.6 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"/>
        </svg>

      </button>

    </div>
  </div>

  <div class="input-group">
    <label>رقم الهاتف</label>

    <input
      type="text"
      name="phone"
      [(ngModel)]="user.phone"
      placeholder="رقم الهاتف"
    >
  </div>

  <div class="input-group">
    <label>الدولة</label>

    <input
      type="text"
      name="country"
      [(ngModel)]="user.location.country"
      placeholder="الدولة"
    >
  </div>

  <div class="bio-field">
    <label>نبذة عنك</label>

    <textarea
      name="bio"
      [(ngModel)]="user.bio"
      placeholder="اكتب نبذة عنك"
    ></textarea>
  </div>

  <button
    type="submit"
    class="save-btn"
  >
    حفظ التعديلات
  </button>

</form>

  </div>

</div>

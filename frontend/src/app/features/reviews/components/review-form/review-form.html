<div class="review-page" dir="rtl">

  <div class="review-card">

    <h1>قيّم تجربتك</h1>

    <p class="subtitle">
      شاركنا رأيك في تجربة التبادل
    </p>

    <div class="rating-section">

      <p>التقييم</p>

      <div class="stars">

        @for (star of [1, 2, 3, 4, 5]; track star) {

        <button
          type="button"
          class="star"
          [class.selected]="star <= rating"
          (click)="selectRating(star)">
          ★
        </button>

        }

      </div>

      <span class="rating-text">
        {{ rating }} من 5
      </span>

    </div>

    <div class="comment-section">

      <label for="comment">
        تعليقك
      </label>

      <textarea
        id="comment"
        [(ngModel)]="comment"
        name="comment"
        rows="5"
        placeholder="اكتب رأيك في التجربة...">
      </textarea>

    </div>

    <button
      type="button"
      class="submit-button"
      (click)="submitReview()">
      إرسال التقييم
    </button>

    @if (successMessage) {
    <div class="success-message">
      {{ successMessage }}
    </div>
    }

    @if (errorMessage) {
    <div class="error-message">
      {{ errorMessage }}
    </div>
    }

  </div>

</div>

<div class="review-page" dir="rtl">

  <div class="review-card">

    <h1>قيّم تجربتك</h1>

    <p class="subtitle" *ngIf="reviewedUserName">
      تقييم تجربة التعامل مع: <strong style="color: #166534;">{{ reviewedUserName }}</strong>
    </p>
    <p class="subtitle" *ngIf="!reviewedUserName">
      شاركنا رأيك في تجربة التبادل والتعامل
    </p>

    <!-- في حالة عدم تمرير معرّف المستخدم عبر الرابط -->
    <div class="user-select-section" *ngIf="!reviewedUserName && !reviewedUserId" style="margin-top: 20px; text-align: right;">
      <label for="reviewedUserId" style="display: block; margin-bottom: 8px; font-weight: 700; color: #374151; font-size: 14px;">
        معرّف المستخدم (User ID)
      </label>
      <input
        type="text"
        id="reviewedUserId"
        [(ngModel)]="reviewedUserId"
        name="reviewedUserId"
        placeholder="أدخل معرّف المستخدم المراد تقييمه..."
        style="width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 14px; padding: 12px 16px; font-size: 15px; outline: none; transition: border-color 0.2s;"
      />
    </div>

    <div class="rating-section">

      <p>التقييم</p>

      <div class="stars">

        @for (star of [1, 2, 3, 4, 5]; track star) {

        <button
          type="button"
          class="star"
          [class.selected]="star <= rating"
          (click)="selectRating(star)">
          ★
        </button>

        }

      </div>

      <span class="rating-text">
        {{ rating }} من 5 نجوم
      </span>

    </div>

    <div class="comment-section">

      <label for="comment">
        تعليقك
      </label>

      <textarea
        id="comment"
        [(ngModel)]="comment"
        name="comment"
        rows="5"
        placeholder="اكتب تفاصيل تجربتك وما أعجبك في التعامل...">
      </textarea>

    </div>

    <button
      type="button"
      class="submit-button"
      [disabled]="submitting"
      (click)="submitReview()">
      {{ submitting ? 'جاري الإرسال...' : 'إرسال التقييم' }}
    </button>

    @if (successMessage) {
    <div class="success-message">
      {{ successMessage }}
    </div>
    }

    @if (errorMessage) {
    <div class="error-message">
      {{ errorMessage }}
    </div>
    }

  </div>

</div>

<nav class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200" dir="rtl">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-3 sm:gap-6">
      
      <!-- اللوجو والروابط -->
      <div class="flex items-center gap-5 shrink-0">
        <a routerLink="/" class="flex items-center gap-2 font-black text-xl text-emerald-700 tracking-tight">
          <span class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-lg shadow-xs">♻️</span>
          <span class="hidden sm:inline">إيكو لوب</span>
        </a>

        <div class="hidden md:flex items-center gap-4 text-xs font-bold text-slate-600">
          <a routerLink="/" routerLinkActive="text-emerald-600 font-black" [routerLinkActiveOptions]="{ exact: true }" class="hover:text-emerald-600 transition">
            الرئيسية
          </a>
          <a routerLink="/items" routerLinkActive="text-emerald-600 font-black" [routerLinkActiveOptions]="{ exact: true }" class="hover:text-emerald-600 transition">
            المعروضات
          </a>

          <!-- قائمة التصنيفات -->
          <div class="relative">
            <button 
              type="button"
              (click)="toggleCategoriesDropdown()"
              class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 hover:text-emerald-600 transition cursor-pointer text-xs font-bold"
            >
              <span>التصنيفات</span>
              <span class="text-[10px] text-slate-400">▼</span>
            </button>

            <div 
              *ngIf="isCategoriesDropdownOpen()" 
              (mouseleave)="isCategoriesDropdownOpen.set(false)"
              class="absolute right-0 mt-2 w-56 rounded-2xl bg-white border border-slate-200 shadow-xl py-2 max-h-80 overflow-y-auto z-50"
            >
              <a 
                routerLink="/items" 
                (click)="isCategoriesDropdownOpen.set(false)"
                class="block px-4 py-2 text-xs font-bold text-slate-800 hover:bg-emerald-50 hover:text-emerald-700 border-b border-slate-100 transition"
              >
                📦 كل التصنيفات
              </a>
              <a 
                *ngFor="let cat of categories()"
                [routerLink]="['/items']"
                [queryParams]="{ categoryId: cat._id }"
                (click)="isCategoriesDropdownOpen.set(false)"
                class="block px-4 py-2 text-xs font-medium text-slate-600 hover:bg-emerald-50 hover:text-emerald-700 transition"
              >
                {{ cat.name }}
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- شريط البحث الموحد للموقع بالكامل (ديسكتوب) -->
      <div *ngIf="!isItemsPage()" class="hidden lg:flex flex-1 max-w-md mx-2">
        <div class="relative w-full">
          <input 
            id="desktopSearchInput"
            name="desktopSearchInput"
            aria-label="البحث عن السلع"
            type="text" 
            [(ngModel)]="searchQuery" 
            (ngModelChange)="onSearchInput($event)"
            placeholder="ابحث عن أجهزة، كتب، أدوية، مستلزمات..." 
            class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pr-9 pl-9 text-xs text-slate-800 placeholder-slate-400 outline-none transition focus:border-emerald-500 focus:bg-white"
          />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs select-none">
            🔍
          </span>
          <button 
            *ngIf="searchQuery" 
            type="button" 
            (click)="clearSearch()" 
            class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-600 font-bold text-xs cursor-pointer p-0.5 transition"
            title="مسح البحث"
          >
            ✕
          </button>
        </div>
      </div>

      <!-- مساحة تعويضية للمحاذاة عند إخفاء السيرش في صفحة المعروضات -->
      <div *ngIf="isItemsPage()" class="hidden lg:flex flex-1"></div>

      <!-- الأزرار والحساب -->
      <div class="flex items-center gap-2.5">
        
        <!-- زر الطلبات المباشر (يظهر فقط للمسجلين) -->
        <a 
          *ngIf="isLoggedIn()"
          routerLink="/requests"
          routerLinkActive="bg-emerald-50 text-emerald-700 border-emerald-300"
          class="relative inline-flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:text-emerald-600 text-xs font-bold transition shadow-xs cursor-pointer"
          title="الطلبات والمعاملات"
        >
          <span class="text-sm leading-none">🔄</span>
          <span class="hidden md:inline">الطلبات</span>
        </a>

        <!-- زر أضف سلعة -->
        <a 
          routerLink="/items/new" 
          class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-xs active:scale-95"
        >
          <span class="text-sm leading-none">+</span>
          <span class="hidden sm:inline">أضف سلعة</span>
        </a>

        <!-- في حالة تسجيل الدخول -->
        <ng-container *ngIf="isLoggedIn(); else guestTpl">
          <div class="relative">
            <button 
              type="button"
              (click)="toggleUserMenu()"
              class="flex items-center gap-2 p-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition cursor-pointer"
            >
              <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center font-black text-xs">
                {{ userInitial() }}
              </div>
              <span class="hidden xl:inline text-xs font-bold text-slate-700 max-w-[90px] truncate">
                {{ userName() }}
              </span>
              <span class="text-[9px] text-slate-400">▼</span>
            </button>

            <div 
              *ngIf="isUserMenuOpen()" 
              (mouseleave)="isUserMenuOpen.set(false)"
              class="absolute left-0 mt-2 w-48 rounded-2xl bg-white border border-slate-200 shadow-xl py-2 z-50"
            >
              <div class="px-4 py-2 border-b border-slate-100">
                <p class="text-xs font-black text-slate-900 truncate">{{ userName() }}</p>
                <p *ngIf="currentUser()?.email" class="text-[10px] text-slate-400 truncate">{{ currentUser()?.email }}</p>
              </div>

              <a routerLink="/profile" (click)="isUserMenuOpen.set(false)" class="block px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-emerald-600">👤 الملف الشخصي</a>
              <a routerLink="/items" [queryParams]="{ owner: 'me' }" (click)="isUserMenuOpen.set(false)" class="block px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-emerald-600">📦 معروضاتي</a>
              <a routerLink="/requests" (click)="isUserMenuOpen.set(false)" class="block px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-emerald-600">🔄 الطلبات والمعاملات</a>
              
              <div class="border-t border-slate-100 my-1"></div>
              <button type="button" (click)="logout()" class="w-full text-right px-4 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50 cursor-pointer">🚪 تسجيل الخروج</button>
            </div>
          </div>
        </ng-container>

        <!-- في حالة عدم تسجيل الدخول (زائر) -->
        <ng-template #guestTpl>
          <div class="flex items-center gap-1.5">
            <a routerLink="/auth/login" class="px-3 py-1.5 text-xs font-bold text-slate-700 hover:text-emerald-600 rounded-lg">دخول</a>
            <a routerLink="/auth/register" class="px-3 py-1.5 text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl hidden sm:inline">حساب جديد</a>
          </div>
        </ng-template>

        <button (click)="toggleMobileMenu()" class="md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100" aria-label="القائمة">
          <span class="text-lg">☰</span>
        </button>
      </div>
    </div>

    <!-- شريط البحث على الموبايل -->
    <div *ngIf="!isItemsPage()" class="pb-3 lg:hidden">
      <div class="relative w-full">
        <input 
          id="mobileSearchInput"
          name="mobileSearchInput"
          aria-label="البحث عن السلع"
          type="text" 
          [(ngModel)]="searchQuery" 
          (ngModelChange)="onSearchInput($event)"
          placeholder="ابحث عن أجهزة، كتب، أدوية..." 
          class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pr-9 pl-9 text-xs outline-none focus:border-emerald-500 focus:bg-white"
        />
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs select-none">🔍</span>
        <button 
          *ngIf="searchQuery" 
          type="button" 
          (click)="clearSearch()" 
          class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-600 font-bold text-xs cursor-pointer p-0.5 transition"
          title="مسح البحث"
        >
          ✕
        </button>
      </div>
    </div>
  </div>

  <!-- قائمة الموبايل -->
  <div *ngIf="isMobileMenuOpen()" class="md:hidden border-t border-slate-200 bg-white px-4 py-4 space-y-3">
    <a (click)="toggleMobileMenu()" routerLink="/" class="block text-xs font-bold text-slate-800">الرئيسية</a>
    <a (click)="toggleMobileMenu()" routerLink="/items" class="block text-xs font-bold text-slate-800">جميع المعروضات</a>
    <a *ngIf="isLoggedIn()" (click)="toggleMobileMenu()" routerLink="/requests" class="block text-xs font-bold text-emerald-700">🔄 الطلبات والمعاملات</a>
    <a *ngIf="isLoggedIn()" (click)="toggleMobileMenu()" routerLink="/profile" class="block text-xs font-bold text-slate-800">الملف الشخصي</a>
    <button *ngIf="isLoggedIn()" (click)="logout()" class="block text-xs font-bold text-rose-600 text-right w-full">تسجيل الخروج</button>
  </div>
</nav>
